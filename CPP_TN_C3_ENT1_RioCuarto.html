function fmt(t){const m=Math.floor(t/60),s=t-m*60;return m>0?m+':'+s.toFixed(3).padStart(6,'0'):t.toFixed(3);}

 function st(cx,cy,tg){if(tg&&tg.closest('.mp-close'))return false;const r=p.getBoundingClientRect();p.style.right='auto';p.style.left=r.left+'px';p.style.top=r.top+'px';dx=cx-r.left;dy=cy-r.top;drag=true;return true;}
 function mv(cx,cy){if(!drag)return;p.style.left=Math.max(4,Math.min(cx-dx,innerWidth-p.offsetWidth-4))+'px';p.style.top=Math.max(4,Math.min(cy-dy,innerHeight-p.offsetHeight-4))+'px';}
 h.addEventListener('mousedown',e=>{if(st(e.clientX,e.clientY,e.target))e.preventDefault();});
 addEventListener('mousemove',e=>mv(e.clientX,e.clientY));addEventListener('mouseup',()=>drag=false);
 h.addEventListener('touchstart',e=>st(e.touches[0].clientX,e.touches[0].clientY,e.target),{passive:true});
 addEventListener('touchmove',e=>{if(drag){mv(e.touches[0].clientX,e.touches[0].clientY);e.preventDefault();}},{passive:false});
 addEventListener('touchend',()=>drag=false);})();
</script></body></html>
