<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis de Tiempos 2026</title>

<!--
  ÍNDICE — TN CLASE 3 · MG-C PERGAMINO · 2026
  =========================================================
  CÓMO FUNCIONA
  Cada evento del fin de semana (entrenamientos, clasificación, series y final)
  muestra siempre los tres análisis: CPP, Ritmo y Evolución. El primer evento
  no lleva Evolución, porque no hay nada anterior contra qué compararlo: para
  ese se pone  primera:true .

  Lo que todavía no está hecho aparece en gris y no se puede tocar. Así el
  índice te sirve también de checklist de lo que falta del fin de semana.

  CARGAR UN ANÁLISIS
  Le agregás la dirección al evento que corresponda:

      { n:"Clasificación", cpp:"/rio-cuarto/clasificacion" }
      { n:"Clasificación", cpp:"/rio-cuarto/clasificacion", ritmo:"p:/Ritmo_Clasif.html" }

  Las direcciones admiten tres formas:
      "/rio-cuarto/final"      → una página de este mismo sitio de Google
      "p:/Ritmo_Final.html"    → un archivo tuyo de GitHub. La "p:" se
                                 reemplaza sola por lo que diga PAGES.
      "https://..."            → cualquier dirección completa, tal cual

  FECHA NUEVA
  Copiás un bloque entero de FECHAS, lo pegás arriba de todo y le cambiás los
  datos. Acordate de sacarle el  ultima:true  a la fecha anterior.
  =========================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&display=swap">

<style>
  :root{
    --ground:#0C0E11;
    --surface:#15181D;
    --surface-2:#1C2027;
    --line:#252A31;
    --line-soft:#1E232A;
    --text:#EDEFF2;
    --muted:#8E96A1;
    --apagado:#4A525C;
    --amber:#F5A623;
    --cyan:#4FC3F7;
    --green:#5BD18C;
    --cond:"Roboto Condensed",'Arial Narrow',Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground);
    color:var(--text);
    font-family:var(--body);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px;}

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding-inline:16px;
    padding-block:18px 22px;
  }

  /* ---------- Encabezado ---------- */
  .top{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px 16px;
    padding-bottom:14px;
    border-bottom:2px solid var(--amber);
  }
  .titulo{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .eyebrow{
    font-family:var(--cond);
    font-size:12px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--cyan);
  }
  .h1{
    font-family:var(--cond);
    font-weight:700;
    font-size:clamp(26px,7vw,40px);
    line-height:1;
    letter-spacing:.01em;
    text-transform:uppercase;
    margin:0;
  }
  .h1 .anio{color:var(--amber);}
  .marca{
    font-family:var(--cond);
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }

  /* ---------- Referencias ---------- */
  .refs{
    display:flex;
    flex-wrap:wrap;
    gap:6px 14px;
    padding:12px 0 16px;
    font-family:var(--cond);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .ref{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.cpp{background:var(--cyan);}
  .dot.ritmo{background:var(--amber);}
  .dot.evo{background:var(--green);}
  .dot.falta{background:transparent;border:1px dashed var(--apagado);}

  /* ---------- Fechas ---------- */
  .fechas{display:flex;flex-direction:column;gap:10px;}

  .fecha{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .fecha[open]{border-color:#333A44;}
  .fecha.destacada{border-left:3px solid var(--amber);}

  summary{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    cursor:pointer;
    list-style:none;
  }
  summary::-webkit-details-marker{display:none;}
  summary:hover{background:var(--surface-2);}

  .fecha-txt{flex:1 1 auto;min-width:0;}
  .circuito{
    font-family:var(--cond);
    font-weight:700;
    font-size:19px;
    line-height:1.15;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .sede{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    overflow-wrap:anywhere;
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
    flex:none;
  }
  .cuando{
    font-family:var(--cond);
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .pill{
    font-family:var(--cond);
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#0C0E11;
    background:var(--amber);
    padding:2px 7px;
    border-radius:3px;
    white-space:nowrap;
  }
  .avance{
    font-family:var(--cond);
    font-size:11px;
    letter-spacing:.1em;
    color:var(--apagado);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .chev{
    flex:none;
    width:11px;height:11px;
    border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);
    transform:rotate(45deg);
    margin-top:-4px;
    transition:transform .18s ease;
  }
  .fecha[open] .chev{transform:rotate(-135deg);margin-top:2px;}

  .cuerpo{
    border-top:1px solid var(--line-soft);
    padding:4px 14px 14px;
    display:flex;
    flex-direction:column;
  }
  .sesion{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:8px 12px;
    padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .sesion:last-child{border-bottom:none;}
  .sesion-nom{
    font-family:var(--cond);
    font-size:13px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    flex:0 0 150px;
  }
  .enlaces{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px;}

  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--cond);
    font-size:13px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:6px 11px;
    border-radius:4px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    transition:background .15s ease,border-color .15s ease;
  }
  .chip:hover{background:#242A33;border-color:#3A424E;}
  .chip .dot{width:7px;height:7px;}

  .chip.falta{
    background:transparent;
    border-style:dashed;
    border-color:#222830;
    color:var(--apagado);
    cursor:default;
  }
  .chip.falta:hover{background:transparent;border-color:#222830;}

  .pie{
    margin-top:18px;
    padding-top:12px;
    border-top:1px solid var(--line-soft);
    font-family:var(--cond);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#5E6772;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:6px 14px;
  }

  @media (max-width:560px){
    .wrap{padding-block:14px 16px;}
    .meta{align-items:flex-end;}
    .sede{display:none;}
    .refs{padding:10px 0 12px;gap:5px 12px;font-size:11px;}
    summary{padding:11px 12px;}
    .circuito{font-size:17px;}
    .cuerpo{padding:2px 12px 10px;}
    .sesion{padding:8px 0;gap:6px 8px;}
    .sesion-nom{flex:1 0 100%;font-size:11.5px;}
    .chip{font-size:12px;padding:5px 9px;}
  }

  @media (prefers-reduced-motion:reduce){
    .chev{transition:none;}
    .chip{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div class="titulo">
      <span class="eyebrow">TN Clase 3 &middot; APAT</span>
      <h1 class="h1">Análisis de Tiempos <span class="anio">2026</span></h1>
    </div>
    <span class="marca">MG-C Pergamino</span>
  </header>

  <div class="refs">
    <span class="ref"><span class="dot cpp"></span>CPP</span>
    <span class="ref"><span class="dot ritmo"></span>Ritmo</span>
    <span class="ref"><span class="dot evo"></span>Evolución</span>
    <span class="ref"><span class="dot falta"></span>Pendiente</span>
  </div>

  <main class="fechas" id="fechas"></main>

  <footer class="pie">
    <span>Turismo Nacional Clase 3</span>
    <span>Temporada 2026</span>
  </footer>

</div>

<script>
/* =========================================================
   DATOS
   ========================================================= */

/* Sitio de Google, donde están las carreras ya cargadas */
var BASE  = "https://sites.google.com/view/turismonacionalmgc-2026";

/* Análisis publicados aparte, en GitHub Pages. Sin la barra final. */
var PAGES = "https://peter2514.github.io/tn-mgc";

var FECHAS = [
  {
    circuito: "Río Cuarto",
    sede: "Autódromo Ciudad de Río Cuarto · 3.230 km",
    cuando: "Fecha 9 · 20/09/26",
    ultima: true,
    eventos: [
      { n:"1er Entrenamiento", primera:true,
        cpp:"/rio-cuarto/1-er-entrenamiento" },
      { n:"2do Entrenamiento",
        cpp:"/rio-cuarto/2do-entrenamiento" },
      { n:"Clasificación",
        cpp:"/rio-cuarto/clasificacion" },
      { n:"1era Serie",
        ritmo:"p:/Ritmo_TN_C3_Serie1_RioCuarto.html" },
      { n:"2da Serie",
        ritmo:"p:/Ritmo_TN_C3_Serie2_RioCuarto.html" },
      { n:"3era Serie",
        ritmo:"p:/Ritmo_TN_C3_Serie3_RioCuarto.html" },
      { n:"Final",
        cpp:"/rio-cuarto/final/clasificados-por-parciales",
        ritmo:"p:/Ritmo_TN_C3_Final_RioCuarto.html",
        evo:"/rio-cuarto/evolucion-general" }
    ]
  },
  {
    circuito: "Villicum 2",
    sede: "Autódromo El Villicum · San Juan",
    cuando: "",
    eventos: [
      { n:"1er Entrenamiento", primera:true,
        cpp:"/villicum-2/entrenamiento-1/cpp",
        ritmo:"/villicum-2/entrenamiento-1/analisis-de-ritmo" },
      { n:"2do Entrenamiento",
        cpp:"/villicum-2/2-do-entrenamiento/cpp",
        ritmo:"/villicum-2/2-do-entrenamiento/analisis-de-ritmo",
        evo:"/villicum-2/2-do-entrenamiento/evolucion-de-tiempos" },
      { n:"Clasificación",
        cpp:"/villicum-2/clasificacion/cpp",
        ritmo:"/villicum-2/clasificacion/ritmo",
        evo:"/villicum-2/clasificacion/evolucion" },
      { n:"1era Serie",
        cpp:"/villicum-2/1era-serie/cpp",
        ritmo:"/villicum-2/1era-serie/ritmo",
        evo:"/villicum-2/1era-serie/evolucion" },
      { n:"2da Serie",
        cpp:"/villicum-2/2-da-serie/cpp",
        ritmo:"/villicum-2/2-da-serie/ritmo",
        evo:"/villicum-2/2-da-serie/evulucion" },
      { n:"3era Serie",
        cpp:"/villicum-2/3-era-serie/cpp",
        ritmo:"/villicum-2/3-era-serie/ritmo",
        evo:"/villicum-2/3-era-serie/evolucion" },
      { n:"Final" }
    ]
  },
  {
    circuito: "Villicum 1",
    sede: "Autódromo El Villicum · San Juan",
    cuando: "",
    eventos: [
      { n:"1er Entrenamiento", primera:true,
        cpp:"/villicum-1-er-carrera/1er-entrenamiento" },
      { n:"2do Entrenamiento",
        cpp:"/villicum-1-er-carrera/2do-entrenamiento" },
      { n:"Clasificación",
        cpp:"/villicum-1-er-carrera/clasificacion",
        ritmo:"/villicum-1-er-carrera/clasificacion/analisis-clasificacion" },
      { n:"1era Serie",
        cpp:"/villicum-1-er-carrera/1er-serie" },
      { n:"2da Serie",
        cpp:"/villicum-1-er-carrera/2da-serie" },
      { n:"3era Serie",
        cpp:"/villicum-1-er-carrera/3er-serie" },
      { n:"Final",
        cpp:"/villicum-1-er-carrera/final",
        ritmo:"/villicum-1-er-carrera/final/analisis-de-ritmos",
        evo:"/villicum-1-er-carrera/evolucion-de-tiempos" }
    ]
  },
  {
    circuito: "Oberá",
    sede: "Autódromo Rosamonte · Misiones",
    cuando: "",
    eventos: [
      { n:"Pre carrera", primera:true,
        cpp:"/obera/pre-carrera" },
      { n:"1er Entrenamiento",
        cpp:"/obera/1-er-entrenamiento" },
      { n:"2do Entrenamiento",
        cpp:"/obera/2-do-entrenamiento" },
      { n:"Clasificación",
        cpp:"/obera/clasificacion" },
      { n:"1era Serie",
        cpp:"/obera/1-era-serie" },
      { n:"2da Serie",
        cpp:"/obera/2-da-serie" },
      { n:"Final",
        cpp:"/obera/final",
        ritmo:"/obera/ritmo-de-la-final",
        evo:"/obera/evolucion-general" }
    ]
  }
];

/* =========================================================
   Armado de la página — de acá para abajo no hace falta tocar
   ========================================================= */

(function(){
  var cont = document.getElementById("fechas");

  var TIPOS = [
    { clave:"cpp",   t:"CPP" },
    { clave:"ritmo", t:"Ritmo" },
    { clave:"evo",   t:"Evolución" }
  ];

  function direccion(u){
    if(/^https?:/i.test(u)) return u;
    if(u.indexOf("p:") === 0) return PAGES + u.slice(2);
    return BASE + u;
  }

  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt != null) n.textContent = txt;
    return n;
  }

  FECHAS.forEach(function(f){
    var hechos = 0, totales = 0;

    var det = el("details", "fecha" + (f.ultima ? " destacada" : ""));
    if(f.ultima) det.open = true;

    var sum = el("summary");

    var txt = el("div","fecha-txt");
    txt.appendChild(el("div","circuito", f.circuito));
    if(f.sede) txt.appendChild(el("div","sede", f.sede));
    sum.appendChild(txt);

    var cuerpo = el("div","cuerpo");

    (f.eventos || []).forEach(function(ev){
      var fila = el("div","sesion");
      fila.appendChild(el("div","sesion-nom", ev.n));

      var enlaces = el("div","enlaces");
      TIPOS.forEach(function(tipo){
        /* el primer evento del fin de semana no lleva Evolución:
           no hay actividad anterior contra qué compararlo */
        if(tipo.clave === "evo" && ev.primera) return;

        totales++;
        var u = ev[tipo.clave];

        if(u){
          hechos++;
          var a = el("a","chip");
          a.href = direccion(u);
          a.target = "_blank";
          a.rel = "noopener";
          a.appendChild(el("span","dot " + tipo.clave));
          a.appendChild(document.createTextNode(tipo.t));
          enlaces.appendChild(a);
        } else {
          var s = el("span","chip falta");
          s.setAttribute("aria-disabled","true");
          s.title = "Todavía sin cargar";
          s.appendChild(el("span","dot falta"));
          s.appendChild(document.createTextNode(tipo.t));
          enlaces.appendChild(s);
        }
      });

      fila.appendChild(enlaces);
      cuerpo.appendChild(fila);
    });

    var meta = el("div","meta");
    if(f.ultima) meta.appendChild(el("span","pill","Última fecha"));
    if(f.cuando) meta.appendChild(el("span","cuando", f.cuando));
    meta.appendChild(el("span","avance", hechos + "/" + totales));
    sum.appendChild(meta);
    sum.appendChild(el("span","chev"));

    det.appendChild(sum);
    det.appendChild(cuerpo);
    cont.appendChild(det);
  });
})();
</script>

</body>
</html>
