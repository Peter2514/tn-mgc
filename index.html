<!--
  ÍNDICE — TN CLASE 3 · MG-C PERGAMINO · 2026
  =========================================================
  CÓMO FUNCIONA
  Cada evento del fin de semana (entrenamientos, clasificación, series y final)
  muestra siempre los tres análisis: CPP, Ritmo y Evolución. El primer evento
  no lleva Evolución, porque no hay nada anterior contra qué compararlo: para
  ese se pone  primera:true .

  Lo que todavía no está hecho aparece en gris y no se puede tocar. Así el
  índice te sirve también de checklist de lo que falta del fin de semana.

  CARGAR UN ANÁLISIS
  Le agregás la dirección al evento que corresponda:

      { n:"Clasificación", cpp:"/rio-cuarto/clasificacion" }
      { n:"Clasificación", cpp:"/rio-cuarto/clasificacion", ritmo:"p:/Ritmo_Clasif.html" }

  Las direcciones admiten tres formas:
      "/rio-cuarto/final"      → una página de este mismo sitio de Google
      "p:/Ritmo_Final.html"    → un archivo tuyo de GitHub. La "p:" se
                                 reemplaza sola por lo que diga PAGES.
      "https://..."            → cualquier dirección completa, tal cual

  FECHA NUEVA
  Copiás un bloque entero de FECHAS, lo pegás arriba de todo y le cambiás los
  datos.

  MATERIAL DEL FIN DE SEMANA
  Arriba de los eventos hay una fila con tres casilleros fijos: Cronograma,
  Pre Carrera y Sectores Cronometrados. Se cargan igual que los análisis, dentro
  de  finde:  , y no suman al contador porque no son análisis por evento:

      finde: {
        cronograma: "p:/Cronograma_Mendoza.png",
        precarrera: "p:/PreCarrera_Mendoza.html",
        sectores:   "p:/Sectores_Mendoza.png"
      },

  El  nro:  es el número de fecha del campeonato y se muestra arriba del
  nombre del circuito. El  cuando:  es sólo el día, sin el número.

  Dos etiquetas, y una sola por fecha:
      proxima:true → la carrera que viene, todavía no corrió. Se abre sola.
      ultima:true  → la última que SÍ corrió.
  Cuando Mendoza termine, le cambiás  proxima:true  por  ultima:true  y le
  sacás el  ultima:true  a Río Cuarto.
  =========================================================
-->

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&display=swap">

<style>
  :root{
    --ground:#0A1728;
    --surface:#0F2136;
    --surface-2:#16304A;
    --line:#224566;
    --line-soft:#17304A;
    --text:#E9EEF5;
    --muted:#8FA6C2;
    --apagado:#4C6685;
    --amber:#C8A84B;
    --cyan:#5BA9E0;
    --green:#63BF93;
    --cond:"Roboto Condensed",'Arial Narrow',Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground);
    color:var(--text);
    font-family:var(--body);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px;}

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding-inline:16px;
    padding-block:18px 22px;
  }

  /* ---------- Banda del logo ---------- */
  .banda{
    background:#0D1B2A;
    border-bottom:3px solid var(--amber);
    padding-block:14px;
    padding-inline:16px;
    display:flex;
    justify-content:center;
  }
  .plato{
    background:var(--amber);
    border-radius:50%;
    padding:7px;
    display:flex;
    line-height:0;
  }
  .banda img{
    width:96px;
    height:96px;
    display:block;
  }

  /* ---------- Encabezado ---------- */
  .top{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px 16px;
    padding-bottom:8px;
  }
  .titulo{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .eyebrow{
    font-family:var(--cond);
    font-size:12px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--cyan);
  }
  .h1{
    font-family:var(--cond);
    font-weight:700;
    font-size:clamp(26px,7vw,40px);
    line-height:1;
    letter-spacing:.01em;
    text-transform:uppercase;
    margin:0;
  }
  .h1 .anio{color:var(--amber);}
  .marca{
    font-family:var(--cond);
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }

  /* ---------- Referencias ---------- */
  .refs{
    display:flex;
    flex-wrap:wrap;
    gap:6px 14px;
    padding:12px 0 16px;
    font-family:var(--cond);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .ref{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.cpp{background:var(--cyan);}
  .dot.ritmo{background:var(--amber);}
  .dot.evo{background:var(--green);}
  .dot.falta{background:transparent;border:1px dashed var(--apagado);}
  .dot.extra{background:var(--muted);}

  /* ---------- Fechas ---------- */
  .fechas{display:flex;flex-direction:column;gap:10px;}

  .fecha{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .fecha[open]{border-color:#2B5480;}
  .fecha.destacada{border-left:3px solid var(--amber);}

  summary{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    cursor:pointer;
    list-style:none;
  }
  summary::-webkit-details-marker{display:none;}
  summary:hover{background:var(--surface-2);}

  .fecha-txt{flex:1 1 auto;min-width:0;}
  .nro{
    display:block;
    font-family:var(--cond);
    font-size:11px;
    font-weight:700;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--apagado);
    margin-bottom:1px;
  }
  .circuito{
    font-family:var(--cond);
    font-weight:700;
    font-size:19px;
    line-height:1.15;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .sede{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    overflow-wrap:anywhere;
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
    flex:none;
  }
  .cuando{
    font-family:var(--cond);
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .pill{
    font-family:var(--cond);
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#0D1B2A;
    background:var(--amber);
    padding:2px 7px;
    border-radius:3px;
    white-space:nowrap;
  }
  .pill.proxima{
    color:var(--cyan);
    background:transparent;
    border:1px solid var(--cyan);
    padding:1px 6px;
  }
  .avance{
    font-family:var(--cond);
    font-size:11px;
    letter-spacing:.1em;
    color:var(--apagado);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .chev{
    flex:none;
    width:11px;height:11px;
    border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);
    transform:rotate(45deg);
    margin-top:-4px;
    transition:transform .18s ease;
  }
  .fecha[open] .chev{transform:rotate(-135deg);margin-top:2px;}

  .cuerpo{
    border-top:1px solid var(--line-soft);
    padding:4px 14px 14px;
    display:flex;
    flex-direction:column;
  }
  .sesion{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:8px 12px;
    padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .sesion:last-child{border-bottom:none;}
  .sesion-nom{
    font-family:var(--cond);
    font-size:13px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    flex:0 0 150px;
  }
  .enlaces{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px;}

  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--cond);
    font-size:13px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:6px 11px;
    border-radius:4px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    transition:background .15s ease,border-color .15s ease;
  }
  .chip:hover{background:#1D3A57;border-color:#2F5D8A;}
  .chip .dot{width:7px;height:7px;}

  .chip.falta{
    background:transparent;
    border-style:dashed;
    border-color:#1D3852;
    color:var(--apagado);
    cursor:default;
  }
  .chip.falta:hover{background:transparent;border-color:#1D3852;}

  .pie{
    margin-top:18px;
    padding-top:12px;
    border-top:1px solid var(--line-soft);
    font-family:var(--cond);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#546F8E;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:6px 14px;
  }

  @media (max-width:560px){
    .banda{padding-block:11px;}
    .banda img{width:76px;height:76px;}.plato{padding:6px;}
    .wrap{padding-block:14px 16px;}
    .meta{align-items:flex-end;}
    .sede{display:none;}
    .refs{padding:10px 0 12px;gap:5px 12px;font-size:11px;}
    summary{padding:11px 12px;}
    .circuito{font-size:17px;}
    .cuerpo{padding:2px 12px 10px;}
    .sesion{padding:8px 0;gap:6px 8px;}
    .sesion-nom{flex:1 0 100%;font-size:11.5px;}
    .chip{font-size:12px;padding:5px 9px;}
  }

  @media (prefers-reduced-motion:reduce){
    .chev{transition:none;}
    .chip{transition:none;}
  }
</style>
</head>

/* =========================================================
   Armado de la página — de acá para abajo no hace falta tocar
   ========================================================= */

(function(){
  var cont = document.getElementById("fechas");

  var MATERIAL = [
    { clave:"cronograma", t:"Cronograma" },
    { clave:"precarrera", t:"Pre Carrera" },
    { clave:"sectores",   t:"Sectores Cronometrados" }
  ];

  var TIPOS = [
    { clave:"cpp",   t:"CPP" },
    { clave:"ritmo", t:"Ritmo" },
    { clave:"evo",   t:"Evolución" }
  ];

  function direccion(u){
    if(/^https?:/i.test(u)) return u;
    if(u.indexOf("p:") === 0) return PAGES + u.slice(2);
    return BASE + u;
  }

  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt != null) n.textContent = txt;
    return n;
  }

  /* Si hay una fecha marcada como próxima, esa es la que se abre sola;
     si no, se abre la última que corrió. */
  var hayProxima = FECHAS.some(function(f){ return f.proxima; });

  FECHAS.forEach(function(f){
    var hechos = 0, totales = 0;

    var det = el("details", "fecha" + (f.ultima || f.proxima ? " destacada" : ""));
    det.open = f.proxima ? true : !!(f.ultima && !hayProxima);

    var sum = el("summary");

    var txt = el("div","fecha-txt");
    if(f.nro) txt.appendChild(el("span","nro", "Fecha " + f.nro));
    txt.appendChild(el("div","circuito", f.circuito));
    if(f.sede) txt.appendChild(el("div","sede", f.sede));
    sum.appendChild(txt);

    var cuerpo = el("div","cuerpo");

    /* Fila del fin de semana. Siempre muestra los tres casilleros.
       No suma al contador: no son análisis por evento. */
    var filaX = el("div","sesion");
    filaX.appendChild(el("div","sesion-nom","Fin de semana"));
    var lx = el("div","enlaces");
    MATERIAL.forEach(function(m){
      var u = f.finde && f.finde[m.clave];
      if(u){
        var a = el("a","chip");
        a.href = direccion(u);
        a.target = "_blank";
        a.rel = "noopener";
        a.appendChild(el("span","dot extra"));
        a.appendChild(document.createTextNode(m.t));
        lx.appendChild(a);
      } else {
        var sp = el("span","chip falta");
        sp.setAttribute("aria-disabled","true");
        sp.title = "Todavía sin cargar";
        sp.appendChild(el("span","dot falta"));
        sp.appendChild(document.createTextNode(m.t));
        lx.appendChild(sp);
      }
    });
    filaX.appendChild(lx);
    cuerpo.appendChild(filaX);

    (f.eventos || []).forEach(function(ev){
      var fila = el("div","sesion");
      fila.appendChild(el("div","sesion-nom", ev.n));

      var enlaces = el("div","enlaces");
      TIPOS.forEach(function(tipo){
        /* el primer evento del fin de semana no lleva Evolución:
           no hay actividad anterior contra qué compararlo */
        if(tipo.clave === "evo" && ev.primera) return;

        totales++;
        var u = ev[tipo.clave];

        if(u){
          hechos++;
          var a = el("a","chip");
          a.href = direccion(u);
          a.target = "_blank";
          a.rel = "noopener";
          a.appendChild(el("span","dot " + tipo.clave));
          a.appendChild(document.createTextNode(tipo.t));
          enlaces.appendChild(a);
        } else {
          var s = el("span","chip falta");
          s.setAttribute("aria-disabled","true");
          s.title = "Todavía sin cargar";
          s.appendChild(el("span","dot falta"));
          s.appendChild(document.createTextNode(tipo.t));
          enlaces.appendChild(s);
        }
      });

      fila.appendChild(enlaces);
      cuerpo.appendChild(fila);
    });

    var meta = el("div","meta");
    if(f.proxima)     meta.appendChild(el("span","pill proxima","Próxima"));
    else if(f.ultima) meta.appendChild(el("span","pill","Última fecha"));
    if(f.cuando) meta.appendChild(el("span","cuando", f.cuando));
    meta.appendChild(el("span","avance", hechos + "/" + totales));
    sum.appendChild(meta);
    sum.appendChild(el("span","chev"));

    det.appendChild(sum);
    det.appendChild(cuerpo);
    cont.appendChild(det);
  });
})();
</script>
