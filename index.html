<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análisis de Tiempos 2026</title>

<!--
  ÍNDICE — TN CLASE 3 · MG-C PERGAMINO · 2026
  =========================================================
  Para agregar una fecha nueva: copiá un bloque { ... } de la lista FECHAS
  (más abajo, en el <script>) y pegalo ARRIBA DE TODO, dentro de los [ ].
  - "ultima: true" pone la etiqueta ÚLTIMA FECHA y deja la tarjeta abierta.
    Acordate de sacarle el "ultima: true" a la fecha anterior.
  - Los "tipo:" pintan el color del botón: tiempos / cpp / ritmo / evolucion
  - Los "u:" son las direcciones, y admiten tres formas:
      "/rio-cuarto/final"       → una página de este mismo sitio de Google
      "p:/rio-cuarto/ritmo"     → un análisis publicado aparte (GitHub Pages).
                                   La "p:" se reemplaza sola por lo que pongas
                                   en PAGES, más abajo.
      "https://..."             → cualquier dirección completa, tal cual
  =========================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;600;700&display=swap">

<style>
  :root{
    --ground:#0C0E11;
    --surface:#15181D;
    --surface-2:#1C2027;
    --line:#252A31;
    --line-soft:#1E232A;
    --text:#EDEFF2;
    --muted:#8E96A1;
    --amber:#F5A623;
    --cyan:#4FC3F7;
    --green:#5BD18C;
    --cond:"Roboto Condensed",'Arial Narrow',Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground);
    color:var(--text);
    font-family:var(--body);
    font-size:14px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:3px;}

  .wrap{
    max-width:880px;
    margin:0 auto;
    padding-inline:16px;
    padding-block:18px 22px;
  }

  /* ---------- Encabezado ---------- */
  .top{
    display:flex;
    flex-wrap:wrap;
    align-items:flex-end;
    justify-content:space-between;
    gap:10px 16px;
    padding-bottom:14px;
    border-bottom:2px solid var(--amber);
  }
  .titulo{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .eyebrow{
    font-family:var(--cond);
    font-size:12px;
    font-weight:700;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--cyan);
  }
  .h1{
    font-family:var(--cond);
    font-weight:700;
    font-size:clamp(26px,7vw,40px);
    line-height:1;
    letter-spacing:.01em;
    text-transform:uppercase;
    margin:0;
  }
  .h1 .anio{color:var(--amber);}
  .marca{
    font-family:var(--cond);
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    white-space:nowrap;
  }

  /* ---------- Referencias ---------- */
  .refs{
    display:flex;
    flex-wrap:wrap;
    gap:6px 14px;
    padding:12px 0 16px;
    font-family:var(--cond);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
  }
  .ref{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.tiempos{background:var(--text);}
  .dot.cpp{background:var(--cyan);}
  .dot.ritmo{background:var(--amber);}
  .dot.evolucion{background:var(--green);}

  /* ---------- Fechas ---------- */
  .fechas{display:flex;flex-direction:column;gap:10px;}

  .fecha{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .fecha[open]{border-color:#333A44;}
  .fecha.destacada{border-left:3px solid var(--amber);}

  summary{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 14px;
    cursor:pointer;
    list-style:none;
  }
  summary::-webkit-details-marker{display:none;}
  summary:hover{background:var(--surface-2);}

  .fecha-txt{flex:1 1 auto;min-width:0;}
  .circuito{
    font-family:var(--cond);
    font-weight:700;
    font-size:19px;
    line-height:1.15;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .sede{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
    overflow-wrap:anywhere;
  }
  .meta{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:5px;
    flex:none;
  }
  .cuando{
    font-family:var(--cond);
    font-size:13px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .pill{
    font-family:var(--cond);
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#0C0E11;
    background:var(--amber);
    padding:2px 7px;
    border-radius:3px;
    white-space:nowrap;
  }
  .chev{
    flex:none;
    width:11px;height:11px;
    border-right:2px solid var(--muted);
    border-bottom:2px solid var(--muted);
    transform:rotate(45deg);
    margin-top:-4px;
    transition:transform .18s ease;
  }
  .fecha[open] .chev{transform:rotate(-135deg);margin-top:2px;}

  .cuerpo{
    border-top:1px solid var(--line-soft);
    padding:4px 14px 14px;
    display:flex;
    flex-direction:column;
  }
  .sesion{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:8px 12px;
    padding:11px 0;
    border-bottom:1px solid var(--line-soft);
  }
  .sesion:last-child{border-bottom:none;}
  .sesion-nom{
    font-family:var(--cond);
    font-size:13px;
    font-weight:600;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    flex:0 0 150px;
  }
  .enlaces{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 200px;}

  .chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--cond);
    font-size:13px;
    font-weight:600;
    letter-spacing:.05em;
    text-transform:uppercase;
    padding:6px 11px;
    border-radius:4px;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    transition:background .15s ease,border-color .15s ease;
  }
  .chip:hover{background:#242A33;border-color:#3A424E;}
  .chip .dot{width:7px;height:7px;}

  .vacio{
    font-size:13px;
    color:var(--muted);
    padding:11px 0;
  }

  .pie{
    margin-top:18px;
    padding-top:12px;
    border-top:1px solid var(--line-soft);
    font-family:var(--cond);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#5E6772;
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    gap:6px 14px;
  }

  @media (max-width:560px){
    .wrap{padding-block:14px 16px;}
    .meta{align-items:flex-end;}
    .sede{display:none;}
    .refs{padding:10px 0 12px;gap:5px 12px;font-size:11px;}
    summary{padding:11px 12px;}
    .circuito{font-size:17px;}
    .cuerpo{padding:2px 12px 10px;}
    .sesion{padding:8px 0;gap:6px 8px;}
    .sesion-nom{flex:1 0 100%;font-size:11.5px;}
    .chip{font-size:12px;padding:5px 9px;}
  }

  @media (prefers-reduced-motion:reduce){
    .chev{transition:none;}
    .chip{transition:none;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="top">
    <div class="titulo">
      <span class="eyebrow">TN Clase 3 &middot; APAT</span>
      <h1 class="h1">Análisis de Tiempos <span class="anio">2026</span></h1>
    </div>
    <span class="marca">MG-C Pergamino</span>
  </header>

  <div class="refs">
    <span class="ref"><span class="dot tiempos"></span>Tiempos</span>
    <span class="ref"><span class="dot cpp"></span>Clasificados por parciales</span>
    <span class="ref"><span class="dot ritmo"></span>Ritmo</span>
    <span class="ref"><span class="dot evolucion"></span>Evolución</span>
  </div>

  <main class="fechas" id="fechas"></main>

  <footer class="pie">
    <span>Turismo Nacional Clase 3</span>
    <span>Temporada 2026</span>
  </footer>

</div>

<script>

var FECHAS = [

        { t:"Tiempos", tipo:"tiempos", u:"/rio-cuarto/final" },
        { t:"Clasif. por parciales", tipo:"cpp", u:"/rio-cuarto/final/clasificados-por-parciales" },
        { t:"Ritmo", tipo:"ritmo", u:"p:/Ritmo_TN_C3_Final_RioCuarto.html" }
      ]},
      { nombre: "Fin de semana", links: [
        { t:"Evolución general", tipo:"evolucion", u:"/rio-cuarto/evolucion-general" }
      ]}
    ]
  },
  {
    circuito: "Villicum 2",
    sede: "Autódromo El Villicum · San Juan",
    cuando: "",
    sesiones: [
      { nombre: "1er Entrenamiento", links: [
        { t:"Tiempos", tipo:"tiempos", u:"/villicum-2/entrenamiento-1" },
        { t:"CPP", tipo:"cpp", u:"/villicum-2/entrenamiento-1/cpp" },
        { t:"Ritmo", tipo:"ritmo", u:"/villicum-2/entrenamiento-1/analisis-de-ritmo" }
      ]},
      { nombre: "2do Entrenamiento", links: [
        { t:"Tiempos", tipo:"tiempos", u:"/villicum-2/2-do-entrenamiento" },
        { t:"CPP", tipo:"cpp", u:"/villicum-2/2-do-entrenamiento/cpp" },
        { t:"Ritmo", tipo:"ritmo", u:"/villicum-2/2-do-entrenamiento/analisis-de-ritmo" },
        { t:"Evolución", tipo:"evolucion", u:"/villicum-2/2-do-entrenamiento/evolucion-de-tiempos" }
      ]},
      { nombre: "Clasificación", links: [
        { t:"Tiempos", tipo:"tiempos", u:"/villicum-2/clasificacion" },
        { t:"CPP", tipo:"cpp", u:"/villicum-2/clasificacion/cpp" },

      ]},

        { t:"Ritmo", tipo:"ritmo", u:"/villicum-2/1era-serie/ritmo" },

      ]},
      { nombre: "2da Serie", links: [

      ]},
      { nombre: "3era Serie", links: [

        { t:"CPP", tipo:"cpp", u:"/villicum-2/3-era-serie/cpp" },
        { t:"Ritmo", tipo:"ritmo", u:"/villicum-2/3-era-serie/ritmo" },
        { t:"Evolución", tipo:"evolucion", u:"/villicum-2/3-era-serie/evolucion" }
      ]}
    ]
  },
  {
    circuito: "Villicum 1",

    sesiones: [

      ]},
      { nombre: "2do Entrenamiento", links: [

      { nombre: "Clasificación", links: [

        { t:"Análisis", tipo:"ritmo", u:"/villicum-1-er-carrera/clasificacion/analisis-clasificacion" }
      ]},

  {

      ]},

      ]},

      ]},

/* =========================================================
   Armado de la página — de acá para abajo no hace falta tocar
   ========================================================= */

(function(){
  var cont = document.getElementById("fechas");

  function direccion(u){
    if(/^https?:/i.test(u)) return u;
    if(u.indexOf("p:") === 0) return PAGES + u.slice(2);
    return BASE + u;
  }

  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt != null) n.textContent = txt;
    return n;
  }

  FECHAS.forEach(function(f){
    var det = el("details", "fecha" + (f.ultima ? " destacada" : ""));
    if(f.ultima) det.open = true;

    var sum = el("summary");

    var txt = el("div","fecha-txt");
    txt.appendChild(el("div","circuito", f.circuito));
    if(f.sede) txt.appendChild(el("div","sede", f.sede));
    sum.appendChild(txt);

    var meta = el("div","meta");
    if(f.ultima) meta.appendChild(el("span","pill","Última fecha"));
    if(f.cuando) meta.appendChild(el("span","cuando", f.cuando));
    if(meta.childNodes.length) sum.appendChild(meta);

    sum.appendChild(el("span","chev"));
    det.appendChild(sum);

    var cuerpo = el("div","cuerpo");

    if(!f.sesiones || !f.sesiones.length){
      cuerpo.appendChild(el("div","vacio","Todavía no hay análisis cargados para esta fecha."));
    } else {
      f.sesiones.forEach(function(s){
        var row = el("div","sesion");
        row.appendChild(el("div","sesion-nom", s.nombre));
        var links = el("div","enlaces");
        s.links.forEach(function(l){
          var a = el("a","chip");
          a.href = direccion(l.u);
          a.target = "_blank";
          a.rel = "noopener";
          a.appendChild(el("span","dot " + (l.tipo || "tiempos")));
          a.appendChild(document.createTextNode(l.t));
          links.appendChild(a);
        });
        row.appendChild(links);
        cuerpo.appendChild(row);
      });
    }

    det.appendChild(cuerpo);
    cont.appendChild(det);
  });
})();
</script>
