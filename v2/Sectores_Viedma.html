<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sectores y marchas · Viedma</title>
<style>
/*
VOICE: hoja de boxes, misma línea que las precarreras (negro, rojo, sectores en color)
IDEA: la gráfica de sectores cronometrados del fin de semana
PICTURE: el trazado grande, cada parcial en su color, con la línea y los cortes marcados
COLOUR and TYPE: fondo carbón, acento rojo, colores de sector del dibujo original; system-ui
LAYOUT: encabezado, mapa grande, fila de 5 tarjetas que encienden el sector
*/
:root{
  --page:#09090a;--surface:#141416;--surface-2:#1c1c1f;--line:rgba(255,255,255,.08);
  --ink:#fff;--ink-2:#b8b7b0;--muted:#84837d;--red:#e2231a;--asphalt:#2b2b2f;--curb:#3a3a3f;
  --s1:#ff3b30;--s2:#4a6cff;--s3:#22b04b;--s4:#ffc21a;--s5:#e9e9e9;
  --radius:14px;color-scheme:dark;
}
:root[data-theme="light"]{
  --page:#eeeeec;--surface:#fff;--surface-2:#f6f6f4;--line:rgba(0,0,0,.10);
  --ink:#111114;--ink-2:#4b4b46;--muted:#77776f;--red:#c81a12;--asphalt:#d9d9d5;--curb:#c4c4bf;
  --s1:#e0241b;--s2:#2f4fe0;--s3:#17923b;--s4:#e5a800;--s5:#111114;color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 600px at 15% -10%,rgba(226,35,26,.10),transparent 60%),var(--page);
  color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 50px}
header{display:flex;align-items:center;gap:18px;padding:16px 20px 16px 24px;margin-bottom:18px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden}
header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red)}
header::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;
  background:repeating-linear-gradient(135deg,rgba(128,128,128,.10) 0 8px,transparent 8px 16px)}
.ht{flex:1;z-index:1}
h1{margin:0;font-size:clamp(20px,3vw,28px);font-weight:800;line-height:1.1}
h1 b{color:var(--red)}
.ht p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.circ{z-index:1;font-size:15px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:0 6px 24px rgba(0,0,0,.30)}
:root[data-theme="light"] .card{box-shadow:0 4px 16px rgba(0,0,0,.06)}
.map svg{display:block;width:100%;height:auto}
.trk{fill:none;stroke-linecap:round;stroke-linejoin:round}
.base{stroke:var(--asphalt);stroke-width:30}
.edge{stroke:var(--curb);stroke-width:34}
.sec{stroke-width:11;transition:opacity .25s,stroke-width .25s;cursor:pointer}
svg.focus .sec{opacity:.18}
svg.focus .sec.on{opacity:1;stroke-width:15}
.badge circle{fill:#111114;stroke-width:4}
.badge text{font:800 22px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
.badge{cursor:pointer;transition:opacity .25s}
svg.focus .badge{opacity:.35}svg.focus .badge.on{opacity:1}
.cut{fill:var(--page);stroke:var(--ink);stroke-width:2.5}
.lbl{font:700 13px system-ui,sans-serif;fill:var(--ink-2)}
.legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px 14px;cursor:pointer;
  text-align:left;font:inherit;color:inherit;transition:border-color .2s,transform .2s;position:relative;overflow:hidden;min-height:44px}
.sc::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.sc:hover{transform:translateY(-2px)}
.sc.on{border-color:var(--c)}
.sc:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.sc .n{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;margin-top:4px}
.sc .n i{width:28px;height:28px;border-radius:50%;background:#111114;border:3px solid var(--c);color:#fff!important;display:inline-grid;place-items:center;font-style:normal;
  font-size:13px}
:root[data-theme="light"] .sc[data-s="5"] .n i{color:#fff}
.sc .d{color:var(--ink-2);font-size:13.5px;margin-top:6px}
.gearrow{display:grid;grid-template-columns:150px minmax(0,1fr) 48px;gap:16px;align-items:center;margin-top:16px}
.gbig{text-align:center}.gbig span{display:block;font-size:12px;color:var(--muted)}
.gbig b{display:block;font-size:56px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums}
.gbig em{display:block;height:18px;font-style:normal;font-size:13px;font-weight:800}
#gsc{transition:transform .18s}
.gkey{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}.gkey i{font-style:normal;font-size:11px;font-weight:800;color:#111;border-radius:5px;padding:1px 6px}
.gbig small{font-size:12px;color:var(--ink-2)}
.gchart{position:relative;height:130px}.gchart svg{position:absolute;inset:0;width:100%;height:100%}
.play{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:14px;cursor:pointer}
.play:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media(max-width:560px){.gearrow{grid-template-columns:80px minmax(0,1fr)}.gbig b{font-size:40px}.play{grid-column:1/-1;justify-self:center}}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:13px}
@media(max-width:860px){.legend{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){header{flex-wrap:wrap}.circ{width:100%;max-width:none}.legend{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{body{background:#fff}.card,.sc,header{box-shadow:none}}
@media(prefers-reduced-motion:reduce){.sc{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="ht">
      <h1>Sectores y <b>marchas</b></h1>
      <p>5 parciales y uso de la caja por curva · tocá un sector para resaltarlo</p>
    </div>
    <div class="circ">Autódromo de Viedma</div>
  </header>

  <div class="card map">
    <svg id="m" viewBox="-30 -30 830 600" role="img" aria-label="Trazado con los 5 sectores">
      <g id="under"></g>
      <g id="secs"></g>
      <g id="cuts"></g>
      <g id="flag"></g>
      <g id="badges"></g>
      <g id="car">
        <g id="carbody"><g transform="scale(1.45)">
          <rect x="-15" y="-11" width="8" height="4.5" rx="1.5" fill="#111"/><rect x="-15" y="6.5" width="8" height="4.5" rx="1.5" fill="#111"/>
          <rect x="7" y="-10.5" width="7" height="4" rx="1.5" fill="#111"/><rect x="7" y="6.5" width="7" height="4" rx="1.5" fill="#111"/>
          <path d="M-18,-8 Q-18,-9.5 -16,-9.5 L10,-8.5 Q19,-7 20,0 Q19,7 10,8.5 L-16,9.5 Q-18,9.5 -18,8 Z" fill="#f4f4f2" stroke="#111" stroke-width="1.4"/>
          <path d="M-3,-6 L6,-5 Q9,0 6,5 L-3,6 Q-5,0 -3,-6 Z" fill="#0d1b3e" opacity=".85"/>
          <rect x="-18" y="-1.6" width="38" height="3.2" fill="#e2231a"/>
          <rect x="-20" y="-9" width="3" height="18" rx="1" fill="#111"/>
        </g></g>
        <g id="gbub" transform="translate(0,-40)"><g id="gsc"><circle r="15" fill="#7b61ff" stroke="#fff" stroke-width="3" id="halo"/><text id="gtx" text-anchor="middle" dominant-baseline="central" y="1" fill="#111" font-weight="800" font-size="17">6</text></g><text id="garr" x="24" y="1" dominant-baseline="central" font-size="18" font-weight="800" opacity="0"></text></g>
      </g>
    </svg>
  </div>

  <div class="gearrow card">
    <div class="gbig"><span>Marcha</span><b id="gbig">6</b><em id="gdir"></em><small id="gsec">Sector 1</small><div class="gkey" id="gkey"></div></div>
    <div class="gchart"><svg id="gc" preserveAspectRatio="none"></svg></div>
    <button class="play" id="play" aria-label="Pausar">❚❚</button>
  </div>
  <div class="legend" id="leg"></div>
  <div class="foot"><span>Sentido de giro: S1 → S2 → S3 → S4 → S5 → línea</span><span>MG-C · Pedro Viglietti</span></div>
</div>

<script>
{
const S=[
 {n:1,c:'--s1',p:'M184,64 L590,70 C700,75 752,120 752,200 C752,260 747,295 743,324',b:[400,32],d:'Recta principal y curva amplia a la derecha'},
 {n:2,c:'--s2',p:'M743,324 C741,380 742,450 702,480 C670,503 610,502 585,472 C560,442 570,400 578,360 C585,320 590,262 585,230 C580,195 560,175 520,174 L425,174',b:[655,530],d:'Curvón bajo, subida y frenada al interior'},
 {n:3,c:'--s3',p:'M425,174 L310,173 C270,174 250,200 252,225 C255,255 280,282 320,330 C360,380 410,435 430,465 C447,492 440,526 400,531 L332,533',b:[205,215],d:'Curva cerrada, ese en diagonal y salida baja'},
 {n:4,c:'--s4',p:'M332,533 L235,530 C140,525 80,480 60,410 C50,370 50,300 51,200 L52,93',b:[135,440],d:'Curva larga a la derecha y recta opuesta'},
 {n:5,c:'--s5',p:'M52,93 C52,50 50,20 75,10 C95,2 105,25 120,40 C140,58 160,64 184,64',b:[6,0],d:'Horquilla y vuelta a la línea'}
];
const NS='http://www.w3.org/2000/svg';
const el=(t,a,parent)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);parent&&parent.appendChild(e);return e};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const m=document.getElementById('m'),under=document.getElementById('under'),secs=document.getElementById('secs'),
      cuts=document.getElementById('cuts'),badges=document.getElementById('badges'),leg=document.getElementById('leg');
const full=S.map(s=>s.p).join(' ').replace(/ M[\d.,]+/g,' ');
el('path',{d:full,class:'trk edge'},under);
el('path',{d:full,class:'trk base'},under);

const paths=[],bs=[];
S.forEach(s=>{
  const p=el('path',{d:s.p,class:'trk sec','data-s':s.n,style:'stroke:var('+s.c+')'},secs);paths.push(p);
  const g=el('g',{class:'badge','data-s':s.n},badges);
  el('circle',{cx:s.b[0],cy:s.b[1],r:20,style:'stroke:var('+s.c+')'},g);
  const t=el('text',{x:s.b[0],y:s.b[1]+1,fill:'#fff'},g);t.textContent=s.n;bs.push(g);
  const start=s.p.match(/M([\d.]+),([\d.]+)/);
  if(s.n!==1)el('circle',{cx:start[1],cy:start[2],r:7,class:'cut'},cuts);
});
/* línea de largada/llegada (inicio de S1) */
const fl=document.getElementById('flag');
for(let i=0;i<4;i++)for(let j=0;j<2;j++)
  el('rect',{x:180+j*6,y:47+i*8.5,width:6,height:8.5,fill:(i+j)%2?'#111':'#fff'},fl);
el('rect',{x:180,y:47,width:12,height:34,fill:'none',stroke:'#111','stroke-width':1},fl);
const lt=el('text',{x:212,y:105,class:'lbl'},fl);lt.textContent='Línea';

leg.innerHTML=S.map(s=>`<button class="sc" data-s="${s.n}" style="--c:var(${s.c})"><div class="n"><i>${s.n}</i>Sector ${s.n}</div></button>`).join('');

let cur=0;
function pick(n){
  cur=(cur===n)?0:n;
  m.classList.toggle('focus',cur>0);
  paths.forEach(p=>p.classList.toggle('on',+p.dataset.s===cur));
  bs.forEach(b=>b.classList.toggle('on',+b.dataset.s===cur));
  leg.querySelectorAll('.sc').forEach(b=>b.classList.toggle('on',+b.dataset.s===cur));
}
leg.addEventListener('click',e=>{const b=e.target.closest('.sc');if(b)pick(+b.dataset.s)});
m.addEventListener('click',e=>{const t=e.target.closest('[data-s]');pick(t?+t.dataset.s:cur)});

/* auto recorriendo la vuelta con la caja cantada por el piloto */
const fp=el('path',{d:full,fill:'none'},m);fp.style.display='none';fp.style.display='';fp.setAttribute('stroke','none');
const L=fp.getTotalLength(),DS=3,NP=Math.floor(L/DS),PTS=[];for(let i=0;i<=NP;i++)PTS.push(fp.getPointAtLength(i*DS));
const near=(x,y)=>{let bi=0,bd=1e9;PTS.forEach((p,i)=>{const d=(p.x-x)**2+(p.y-y)**2;if(d<bd){bd=d;bi=i}});return bi*DS};
/* [x,y del punto de cambio, marcha] en orden de marcha desde la línea */
const GE=[
 [230,65,4],[340,66,5],[470,68,6],                               /* recta principal */
 [630,72,5],[750,250,6],                                         /* curva 1: baja una, la hace en 5ª */
 [742,370,5],[742,395,4],[741,420,3],[580,395,4],[586,300,5],    /* curva 2 en 3ª */
 [588,262,4],[585,238,3],[470,174,4],                            /* curva 3 en 3ª */
 [345,173,3],[312,173,2],[272,268,3],[325,336,4],[380,405,5],    /* curva 4 en 2ª */
 [420,447,4],[428,458,3],[436,472,2],[370,532,3],[310,532,4],[245,530,5], /* la chiquita en 2ª */
 [52,330,6],                                                     /* curvón en 5ª, sale en 6ª */
 [52,170,5],[52,150,4],[52,130,3],[52,112,2],[52,96,1],          /* baja 5 a primera: curva 0 */
 [100,20,2],[150,59,3]
].map(e=>({s:near(e[0],e[1]),g:e[2]})).sort((a,b)=>a.s-b.s);
const gearAt=s=>{let g=GE[GE.length-1].g;for(const e of GE){if(e.s<=s)g=e.g;else break}return g};
/* velocidad estimada por marcha (no es la vuelta real) */
const V=[0,55,80,105,130,152,172],AUP=70,ADN=320;
const T=[];let v=V[gearAt(0)],t=0;
for(let lap=0;lap<2;lap++){let s0=0;t=0;T.length=0;
  while(s0<L){const g=gearAt(s0),vt=V[g];v=v<vt?Math.min(vt,v+AUP/120):Math.max(vt,v-ADN/120);T.push([t,s0,g]);s0+=v/120;t+=1/120}}
const LAP=t;
const secStart=[];{let acc=0;const lens0=paths.map(p=>p.getTotalLength());lens0.forEach(l=>{secStart.push(acc);acc+=l})}
const secOf=s=>{let i=0;while(i<secStart.length-1&&s>=secStart[i+1])i++;return i};
const secT=secStart.map(ss=>{const r=T.find(x=>x[1]>=ss);return r?r[0]:0});

/* gráfico de marchas en el tiempo */
const gc=document.getElementById('gc');
function drawChart(){const W=gc.clientWidth,H=gc.clientHeight;if(!W)return;const l=26,r=6,tp=8,bt=18;
  const X=tt=>l+(W-l-r)*tt/LAP,Y=g=>tp+(H-tp-bt)*(6-g)/5;
  let h='';
  secT.forEach((st,i)=>{const en=i<secT.length-1?secT[i+1]:LAP;h+='<rect x="'+X(st)+'" y="'+tp+'" width="'+(X(en)-X(st))+'" height="'+(H-tp-bt)+'" style="fill:var('+S[i].c+')" opacity=".10"/><text x="'+((X(st)+X(en))/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="11" style="fill:var(--muted)">S'+(i+1)+'</text>'});
  for(let g=1;g<=6;g++)h+='<line x1="'+l+'" x2="'+(W-r)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" style="stroke:var(--line)"/><text x="'+(l-8)+'" y="'+(Y(g)+4)+'" text-anchor="end" font-size="11" style="fill:var(--muted)">'+g+'</text>';
  let d='',pg=null;T.forEach(([tt,,g],i)=>{if(i%6&&g===pg)return;const x=X(tt);d+=(d?(g!==pg?' L'+x+','+Y(pg)+' L':' L'):'M')+x+','+Y(g);pg=g});
  d+=' L'+X(LAP)+','+Y(pg);
  h+='<path d="'+d+'" fill="none" style="stroke:var(--ink)" stroke-width="2"/><line id="gcur" x1="0" x2="0" y1="'+tp+'" y2="'+(H-bt)+'" style="stroke:var(--red)" stroke-width="2"/>';
  gc.innerHTML=h;gc._X=X}
const gro=new ResizeObserver(drawChart);gro.observe(gc);drawChart();

const GC=['','#ff3b30','#ff8a00','#ffd60a','#34c759','#32ade6','#7b61ff'],UP='#3ce06e',DN='#ff4d4d';
document.getElementById('gkey').innerHTML=GC.slice(1).map((c,i)=>'<i style="background:'+c+'">'+(i+1)+'</i>').join('');
const gsc=document.getElementById('gsc'),garr=document.getElementById('garr'),gdir=document.getElementById('gdir');let flashT=null;
const car=document.getElementById('car'),body=document.getElementById('carbody'),halo=document.getElementById('halo'),
      gtx=document.getElementById('gtx'),gbig=document.getElementById('gbig'),gsec=document.getElementById('gsec');
const SPD=0.6;let t0=null,paused=false,tp=0,lastG=0,idx=0;
function place(tt){
  while(idx>0&&T[idx][0]>tt)idx=0;
  while(idx<T.length-1&&T[idx+1][0]<=tt)idx++;
  const [,s0,g]=T[idx],p=fp.getPointAtLength(s0),q=fp.getPointAtLength(Math.min(L,s0+4)),p0=fp.getPointAtLength(Math.max(0,s0-4));
  const ang=Math.atan2(q.y-p0.y,q.x-p0.x)*180/Math.PI,si=secOf(s0),col=css(S[si].c)||'#fff';
  car.setAttribute('transform','translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')');
  body.setAttribute('transform','rotate('+ang.toFixed(1)+')');
  if(g!==lastG){
    const dir=lastG?(g<lastG?-1:1):0;
    gtx.textContent=g;gbig.textContent=g;halo.setAttribute('fill',GC[g]);gbig.style.color=GC[g];
    if(dir){const c=dir<0?DN:UP;
      garr.textContent=dir<0?'▼':'▲';garr.setAttribute('fill',c);garr.setAttribute('opacity','1');
      halo.setAttribute('stroke',c);gsc.setAttribute('transform','scale(1.35)');
      gdir.textContent=dir<0?'▼ Bajada':'▲ Subida';gdir.style.color=c;
      clearTimeout(flashT);flashT=setTimeout(()=>{garr.setAttribute('opacity','0');halo.setAttribute('stroke','#fff');gsc.setAttribute('transform','');gdir.textContent=''},650)}
    lastG=g}
  gsec.textContent='Sector '+(si+1);
  const cur=document.getElementById('gcur');if(cur&&gc._X){const x=gc._X(tt);cur.setAttribute('x1',x);cur.setAttribute('x2',x)}
}
function step(ts){
  if(t0===null)t0=ts;
  if(!paused)tp=((ts-t0)/1000*SPD)%LAP;else t0=ts-tp*1000/SPD;
  place(tp);requestAnimationFrame(step);
}
requestAnimationFrame(step);
const play=document.getElementById('play');
play.addEventListener('click',()=>{paused=!paused;play.textContent=paused?'▶':'❚❚';play.setAttribute('aria-label',paused?'Seguir':'Pausar')});
window.__LAP=LAP;
}
</script>
</body>
</html>
